<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>設計作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 左側固定側欄（頭像、名字、分類目錄）＋ 右側作品；手機版側欄收成頂部選單。固定白底單一主題 */
:root{
  --bg:#ffffff; --fg:#1c1e1b; --muted:#7c8179; --line:#e8e9e6; --accent:#4f6f53; --soft:#f2f3f0; color-scheme:light;
  /* 英文一律 Inter Tight，中文落到 Noto Sans TC */
  --font-body:"Inter Tight","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:var(--font-body);
  --s-xs:11px; --s-sm:13px; --s-md:15px; --s-lg:20px; --s-xl:28px;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:var(--s-md);line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
img{display:block;max-width:100%}

.shell{display:grid;grid-template-columns:224px minmax(0,1fr);gap:56px;padding-inline:clamp(24px,2.5vw,44px);padding-block:40px 64px}

/* ---------- 側欄 ---------- */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 40px);align-self:start;display:flex;flex-direction:column;gap:28px;font-size:var(--s-sm)}
.id{display:flex;flex-direction:column;gap:14px}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--soft)}
.name{font-size:var(--s-lg);font-weight:500;letter-spacing:.02em;line-height:1.35;margin:0;white-space:nowrap}
.role{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.nav a{position:relative;display:inline-flex;align-items:baseline;color:var(--muted);transition:color .2s}
.nav a:hover,.nav a[aria-current="page"]{color:var(--fg)}
/* Home、About 是標題：黑色、粗一點、大寫字距；分類是灰色小字 */
.nav .head a{color:var(--fg);font-size:var(--s-xs);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
/* 滑鼠移到 HOME、ABOUT ZHEN 時字變淡，提示可以點 */
.nav .head a:hover{color:#a9ada6}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:50%;width:5px;height:5px;border-radius:50%;background:var(--accent);translate:0 -50%}
.nav .sep{height:1px;background:var(--line);margin:10px 0}
.nav .gap{height:8px}
.social{display:flex;flex-direction:column;gap:4px;font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted)}
.social a:hover{color:var(--fg)}
.social a,.links a{display:inline-flex;align-items:center;gap:8px;width:fit-content}
.ico{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.links .ico{width:16px;height:16px}
.menu-btn{display:none}

/* ---------- 主內容 ---------- */
main{min-width:0;animation:in .35s ease both}
@keyframes in{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
.crumb{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);letter-spacing:.04em;margin:0 0 20px}
.crumb a:hover{color:var(--fg)}
.page-h{font-size:var(--s-xl);font-weight:500;margin:0 0 6px;line-height:1.3;text-wrap:balance}
.page-sub{color:var(--muted);font-size:var(--s-sm);margin:0 0 36px}

.grid{columns:3 260px;column-gap:28px}
.card{break-inside:avoid;margin:0 0 36px;display:block}
.card .img{overflow:hidden;background:var(--soft)}
.card img{width:100%;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .3s}
.card:hover img{transform:scale(1.025);opacity:.92}
.cap{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-top:10px;font-size:var(--s-sm)}
.cap .t{min-width:0}
.cap .t span{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--accent);margin-right:4px}
.cap .y{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:var(--s-sm);padding:40px 0}

/* ---------- 首頁：自動滾動作品帶 ---------- */
/* 左右兩側柔和淡出（緩和曲線，約 5% 寬；手機版不淡出） */
.ticker{-webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.06) .6%,rgba(0,0,0,.22) 1.4%,rgba(0,0,0,.48) 2.3%,rgba(0,0,0,.74) 3.2%,rgba(0,0,0,.92) 4.1%,#000 5%,#000 95%,rgba(0,0,0,.92) 95.9%,rgba(0,0,0,.74) 96.8%,rgba(0,0,0,.48) 97.7%,rgba(0,0,0,.22) 98.6%,rgba(0,0,0,.06) 99.4%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.06) .6%,rgba(0,0,0,.22) 1.4%,rgba(0,0,0,.48) 2.3%,rgba(0,0,0,.74) 3.2%,rgba(0,0,0,.92) 4.1%,#000 5%,#000 95%,rgba(0,0,0,.92) 95.9%,rgba(0,0,0,.74) 96.8%,rgba(0,0,0,.48) 97.7%,rgba(0,0,0,.22) 98.6%,rgba(0,0,0,.06) 99.4%,transparent 100%);--H:clamp(260px,62vh,620px);padding-top:12px;padding-bottom:44px;margin-bottom:-24px;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ticker.dragging{cursor:grabbing}
.track{display:flex;align-items:flex-start;gap:28px;width:max-content;will-change:transform;backface-visibility:hidden}
.tk{flex:none;display:flex;flex-direction:column;gap:10px;-webkit-user-drag:none;transition:opacity .45s ease,filter .45s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
.tk{perspective:1100px}
/* 立體感：柔和的多層陰影，選中時陰影加深並跟著滑鼠微微傾斜 */
.tk .img{position:relative;height:var(--H);max-width:none;overflow:hidden;background:var(--soft);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;box-shadow:0 1px 2px rgba(24,28,24,.05),0 10px 24px -14px rgba(24,28,24,.22);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .5s ease}
.tk.is-hover .img,.tk.is-focus .img{box-shadow:0 2px 4px rgba(24,28,24,.06),0 28px 50px -18px rgba(24,28,24,.34)}
.tk img{position:absolute;top:0;left:-8%;width:116%;height:100%;max-width:none;object-fit:cover;-webkit-user-drag:none;user-select:none;will-change:translate;transition:scale .9s cubic-bezier(.2,.7,.2,1)}
/* 被選中的作品：微微浮起、圖片放大，其他作品變淡 */
.tk.is-hover{transform:translateY(-8px)}
.tk.is-hover img{scale:1.05}
.track.has-hover .tk:not(.is-hover){opacity:.25;filter:grayscale(.8)}
/* 手機版沒有滑鼠：畫面中間的作品自動被選中 */
.tk.is-focus{transform:translateY(-6px)}
.tk.is-focus img{scale:1.04}
.track.has-focus .tk:not(.is-focus){opacity:.4;filter:grayscale(.6)}
.tk .cap .t::after{content:"→";display:inline-block;margin-left:6px;color:var(--accent);opacity:0;transform:translateX(-4px);transition:opacity .3s,transform .3s}
.tk.is-focus .cap .t::after{opacity:1;transform:none}
.tk .cap{margin-top:0;width:0;min-width:100%;transition:color .3s}
.cursor{position:fixed;left:0;top:0;z-index:50;pointer-events:none;width:8px;height:8px;border-radius:999px;background:var(--fg);box-shadow:0 0 0 1px rgba(255,255,255,.55);display:grid;place-items:center;opacity:0;transition:width .35s cubic-bezier(.2,.7,.2,1),height .35s cubic-bezier(.2,.7,.2,1),background-color .3s,opacity .2s}
.cursor span{font-family:var(--font-body);font-size:7.5pt;line-height:1;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--bg);white-space:nowrap;opacity:0;transition:opacity .2s}
html.has-cursor .cursor{opacity:1}
html.has-cursor .cursor.hide{opacity:0}
.cursor.link{width:18px;height:18px;background:rgba(28,30,27,.22);box-shadow:none}
.cursor.view{width:44px;height:20px;background:var(--fg);box-shadow:none}
.cursor.view span{opacity:1;transition-delay:.08s}
/* 只有用滑鼠的裝置才把系統游標換成小黑點 */
@media (hover:hover) and (pointer:fine){html.has-cursor,html.has-cursor *{cursor:none!important}}
@media (hover:none),(pointer:coarse){.cursor{display:none}}
@media (max-width:820px){.ticker{--H:clamp(200px,38vh,320px);-webkit-mask-image:none;mask-image:none}.track{gap:16px}}

/* ---------- 作品內頁 ---------- */
.work{max-width:880px}
.work-head{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:40px;margin-bottom:40px}
.work-head .en{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);letter-spacing:.06em;margin:0 0 18px}
.summary{margin:0;max-width:34em}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:var(--s-sm);margin:0;align-content:start;border-top:1px solid var(--line);padding-top:12px}
.meta dt{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);letter-spacing:.06em;padding-top:2px}
.meta dd{margin:0}
.block{display:grid;grid-template-columns:140px minmax(0,1fr);gap:24px;margin:0 0 32px}
.block h3{font-size:var(--s-sm);font-weight:500;margin:0;color:var(--muted)}
.block p{margin:0;max-width:36em}
.gallery{display:flex;flex-direction:column;gap:20px;margin:48px 0}
.gallery img{width:100%;background:var(--soft)}
.pager{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:16px;font-size:var(--s-sm)}
.pager a{display:flex;flex-direction:column;min-width:0}
.pager a:last-child{text-align:right}
.pager small{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted)}
.pager a:hover strong{color:var(--accent)}
.pager strong{font-weight:500;transition:color .2s}

/* ---------- About ---------- */
/* About 版面：手機一欄；平板／小筆電：照片＋內容兩欄；大螢幕：照片｜自介與聯絡｜經歷 三欄，避免右邊大片留白 */
.about{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:48px 56px;align-items:start}
.exp-col{grid-column:2}
@media (min-width:821px){.portrait{position:sticky;top:40px}}
/* 大螢幕：自介欄和經歷欄之間拉開距離，中間加一條細直線，形成兩個版面 */
@media (min-width:1200px){.about{grid-template-columns:minmax(0,220px) minmax(0,1fr) minmax(0,1.4fr);column-gap:48px}.exp-col{grid-column:3;grid-row:1;align-self:stretch;margin-left:24px;padding-left:48px;border-left:1px solid var(--line)}}
.portrait{width:100%;aspect-ratio:1;object-fit:cover;background:var(--soft)}
.about h2{font-size:var(--s-xs);font-family:var(--font-mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.about section{display:flex;flex-direction:column}
.stack{display:flex;flex-direction:column;gap:40px}
.disc{font-size:var(--s-sm);line-height:1.7;margin:0 0 10px;text-wrap:pretty}
/* About 頁內文統一：13px、同一種字體、同樣行高 */
.bio p{margin:0 0 10px;max-width:42em;font-size:var(--s-sm);line-height:1.7;text-wrap:pretty}
.mail{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.mail code{font-family:var(--font-mono);font-size:var(--s-sm);user-select:all;word-break:break-all}
.copy{font:inherit;font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;transition:.2s}
.copy:hover{color:var(--fg);border-color:var(--muted)}
.links{display:flex;flex-direction:column;gap:4px;font-family:var(--font-mono);font-size:var(--s-sm)}
.links a{color:var(--muted);word-break:break-all}.links a:hover{color:var(--fg)}
.note{font-size:var(--s-sm);color:var(--muted);margin:12px 0 0}
.exp-group{margin:0}
.exp-group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:var(--s-sm);line-height:1.7;text-wrap:pretty}
.exp-group li{position:relative;padding-left:14px}
.exp-group li::before{content:"";position:absolute;left:0;top:.72em;width:4px;height:4px;border-radius:50%;background:var(--muted)}
/* 經歷區塊：跟其他區一樣有圓點；標題粗體，底下小標和說明分兩行，跟標題文字對齊 */
.exp-group li.entry + li.entry{margin-top:18px}
.exp-group .t{display:block;font-weight:600}
.exp-group .d{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.exp-group .row{display:flex;flex-direction:column}
.exp-group .k{color:var(--fg)}
.exp-group .v{color:var(--muted)}
.tagline{margin:12px 0 0;font-size:var(--s-sm);line-height:1.7;color:var(--muted);text-wrap:pretty}
.strip{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px}
.strip img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--soft)}

footer{grid-column:1/-1;font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);padding-top:48px}
/* 電腦版：版權標記固定在左側欄最下方，每一頁位置都一樣 */
.side-foot{margin:auto 0 0;font-size:var(--s-xs);color:var(--muted)}

/* ---------- 手機 ---------- */
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:24px;padding-inline:18px;padding-block:0 48px}
  /* 手機版頂部列：固定在上方的霧面玻璃 */
  .side{position:sticky;top:0;z-index:40;gap:0;margin-inline:-18px;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px}
  .side::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid rgba(232,233,230,.7);transition:background-color .35s}
  .side.open::before{background:rgba(255,255,255,0);border-bottom-color:transparent}
  .id{position:relative;z-index:2}
  .side-foot{display:none}
  .id{flex-direction:row;align-items:center;gap:12px}
  .avatar{width:44px;height:44px}
  .name{font-size:var(--s-md)}
  /* 三條線的選單按鈕，打開時變成 × */
  .menu-btn{display:inline-flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:44px;height:44px;margin-left:auto;margin-right:-10px;padding:0;background:none;border:0;cursor:pointer;color:var(--fg)}
  .menu-btn span{display:block;width:20px;height:1.5px;border-radius:2px;background:currentColor;transition:transform .4s cubic-bezier(.2,.7,.2,1),opacity .2s ease}
  .side.open .menu-btn span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
  .side.open .menu-btn span:nth-child(2){opacity:0}
  .side.open .menu-btn span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
  /* 點 Menu：霧面玻璃全螢幕選單淡入，項目依序浮現 */
  .side-body{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;gap:32px;padding:calc(env(safe-area-inset-top,0px) + 100px) 18px calc(env(safe-area-inset-bottom,0px) + 40px);overflow-y:auto;background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);opacity:0;visibility:hidden;transition:opacity .4s ease .3s,visibility 0s linear .7s}
  .side.open .side-body{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
  /* 收起：由下往上依序淡出，最後霧面再淡掉 */
  .side-body .nav > li,.side-body .social > a{opacity:0;transform:translateY(10px);transition:opacity .3s ease,transform .4s ease;transition-delay:calc(var(--ri,0) * 25ms)}
  /* 打開：由上往下依序浮現 */
  .side.open .side-body .nav > li,.side.open .side-body .social > a{opacity:1;transform:none;transition:opacity .45s ease,transform .55s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0) * 45ms + 80ms)}
  .side-body .nav{gap:10px}
  .side-body .nav a{font-size:16px}
  .side-body .nav .head a{font-size:var(--s-sm)}
  .side-body .social{font-size:var(--s-sm);gap:10px}
  .work-head,.about{grid-template-columns:minmax(0,1fr);gap:28px}
  .exp-col{grid-column:auto}
  .strip{gap:8px}
  .block{grid-template-columns:minmax(0,1fr);gap:4px}
}
@media (min-width:821px){.side{min-height:calc(100vh - 104px)}.side-body{flex:1;display:flex;flex-direction:column;gap:28px}footer{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="id">
      <img class="avatar" id="avatar" alt="">
      <div>
        <p class="name" id="name"></p>
        <div class="role" id="role"></div>
      </div>
      <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="sideBody" aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
    <div class="side-body" id="sideBody">
      <ul class="nav" id="nav"></ul>
      <div class="social" id="social"></div>
      <p class="side-foot" id="sideFoot"></p>
    </div>
  </aside>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div class="cursor" id="cursor" aria-hidden="true"><span>View</span></div>

<script>
/* =========================================================
   ✏️ 修改說明（只需要改這一段 SITE 裡的文字就好）
   - 文字：直接改引號裡的字。
   - 圖片：把圖片檔放在網站資料夾的 images/ 裡，然後填路徑，
           例如 cover: "images/qingcao-cover.jpg"
           留空 "" 的地方會自動顯示灰色佔位圖。
   - 新增作品：複製 projects 裡一整個 { ... }，改 id 和內容。
   - 分類：category 要對應下面 categories 的 id（brand / event / logotype / poster / book / photo / playground）。
   ========================================================= */
const SITE = {
  name: "李宜臻 / Yi-Zhen Lee",
  role: "Designer",
  avatar: "",            // 頭像，例如 "images/me.jpg"
  portrait: "",          // About 頁的大照片
  disciplines: ["Brand Identity","Event Identity","Logotype","Poster","Book Design","Photography"],
  tagline: "臺灣科技大學設計系｜現任設計系學會副會長｜善於設計企劃、品牌設計、攝影相關",
  bio: [
    "專注於設計企劃、品牌視覺與影像紀錄。我習慣細緻觀察身邊的人事物，並透過文字梳理邏輯與脈絡，將抽象的觀察轉化為具體的設計概念。",
    "在校期間三度獲得書卷獎，具備穩定的自律性與研究能力，期許自己在團隊協作中，發揮細節敏銳度與企劃執行力。"
  ],
  email: "emilyin950706@gmail.com",
  phone: "+886-982-620-366",
  socials: [
    { label: "Linktree",  url: "https://linktr.ee/emily950706" },
    { label: "Behance",   url: "https://www.behance.net/emilylee56" }
  ],
  contactNote: "若有合作或實習機會，歡迎與我聯繫。",
  /* 經歷：一般項目直接寫一行字；需要補充說明的寫成 { t: "標題", d: ["說明｜內容", ...] } */
  experience: [
    { group: "Education", items: [
      "臺灣科技大學 設計系",
      "臺灣科技大學 設計系學會 副會長"

/* 自訂游標：平常是小黑點，移到連結上變成淡色圓圈，移到作品上放大成 VIEW */
const Cursor = (() => {
  const el = $("#cursor"), root = document.documentElement;
  let x = -100, y = -100, tx = -100, ty = -100, view = false, link = false, down = false, sc = 1, last = performance.now();
  addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") { el.classList.add("hide"); return; }
    tx = e.clientX; ty = e.clientY;
    if (x < -50) { x = tx; y = ty; }
    root.classList.add("has-cursor"); el.classList.remove("hide");
    link = !!(e.target.closest && e.target.closest("a, button"));
  });
  document.addEventListener("mouseout", e => { if (!e.relatedTarget) el.classList.add("hide"); });
  addEventListener("pointerdown", e => { if (e.pointerType === "mouse") down = true; });
  addEventListener("pointerup", () => { down = false; });
  const loop = now => {
    const dt = Math.min(now - last, 50) / 1000, k = Math.min(1, dt * 30); last = now;
    x += (tx - x) * k; y += (ty - y) * k;
    sc += ((down ? .8 : 1) - sc) * Math.min(1, dt * 22);   // 按下時圓點原地縮小，不影響位置
    el.style.transform = `translate3d(${x}px,${y}px,0) translate(-50%,-50%) scale(${sc.toFixed(3)})`;
    el.classList.toggle("view", view); el.classList.toggle("link", link && !view);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  return { setView(v){ view = v; }, refresh(){ const t = document.elementFromPoint(tx, ty); link = !!(t && t.closest("a, button")); } };
})();

/* 作品帶自動滾動：無限循環、滑鼠移上暫停、可拖曳／滑動（放開後會順著慣性滑一段） */

    }

  let blockClickUntil = 0;
  el.addEventListener("click", ev => { if (performance.now() < blockClickUntil) { ev.preventDefault(); ev.stopPropagation(); } }, true);

      <section><h1 class="page-h">${esc(SITE.name)}</h1><div class="role">${esc(SITE.role)}</div><p class="tagline">${esc(SITE.tagline)}</p></section>
      <section class="bio"><h2>About Zhen</h2><p class="disc">${SITE.disciplines.map(esc).join(" / ")}</p>${SITE.bio.map(b => `<p>${esc(b)}</p>`).join("")}</section>
      <section><h2>Email</h2><div class="mail"><code id="mail">${esc(SITE.email)}</code><button class="copy" type="button" data-copy="mail">複製</button></div></section>
      <section><h2>Phone</h2><div class="mail"><a href="tel:${esc(SITE.phone.replace(/[^+\d]/g, ""))}"><code id="phone">${esc(SITE.phone)}</code></a><button class="copy" type="button" data-copy="phone">複製</button></div></section>
      <section><h2>Follow</h2><div class="links">${SITE.socials.map(s => extLink({ label: s.url.replace(/^https?:\/\/(www\.)?/, ""), url: s.url })).join("")}</div><p class="note">${esc(SITE.contactNote)}</p></section>
    </div>
    <div class="stack exp-col">
      ${SITE.experience.map(g => `<section class="exp-group"><h2>${esc(g.group)}</h2><ul>${g.items.map(expItem).join("")}</ul></section>`).join("")}
    </div>
    <div class="strip">${SITE.projects.slice(0, 5).map((p, i) => `<a href="#w-${p.id}"><img src="${p.cover || ph(p.title, "3/4", i)}" alt="${esc(p.title)}" loading="lazy"></a>`).join("")}</div>
  </div>`;
}

function render(){
  const route = (location.hash || "#home").slice(1) || "home";
  let html, active = route;
  if (route === "about") html = about();
  else if (route.startsWith("w-") && idx(route.slice(2)) > -1) { const p = SITE.projects[idx(route.slice(2))]; html = work(p); active = p.category; }
  else if (SITE.categories.some(c => c.id === route)) html = category(catOf(route));
  else { html = home(); active = "home"; }
  sidebar(active);
  const m = $("#main"); m.style.animation = "none"; m.offsetHeight; m.style.animation = "";
  m.innerHTML = html;
  setMenu(false);
  window.scrollTo(0, 0);
  if ($("#ticker")) startTicker(); else stopTicker();
  Cursor.refresh();
  document.querySelectorAll("[data-copy]").forEach(btn => btn.onclick = () => {
    const el = $("#" + btn.dataset.copy), text = el.textContent;
    const done = t => { btn.textContent = t; setTimeout(() => btn.textContent = "複製", 1600); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done("已選取"); };
    try { navigator.clipboard.writeText(text).then(() => done("已複製"), sel); } catch (e) { sel(); }
  });
}
function setMenu(o){
  $("#side").classList.toggle("open", o);
  $("#menuBtn").setAttribute("aria-expanded", o);
  $("#menuBtn").setAttribute("aria-label", o ? "Close menu" : "Open menu");
  document.documentElement.style.overflow = o ? "hidden" : "";
  // 讓選單項目依序浮現
  const items = [...document.querySelectorAll("#nav > li, #social > a")];
  items.forEach((el, k) => { el.style.setProperty("--i", k); el.style.setProperty("--ri", items.length - 1 - k); });
}
$("#menuBtn").onclick = () => setMenu(!$("#side").classList.contains("open"));
addEventListener("keydown", e => { if (e.key === "Escape" && $("#side").classList.contains("open")) setMenu(false); });
addEventListener("hashchange", render);
render();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>設計作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 左側固定側欄（頭像、名字、分類目錄）＋ 右側作品瀑布流；手機版側欄收成頂部選單 */
:root{
  --bg:#fafaf8; --fg:#1c1e1b; --muted:#7c8179; --line:#e5e7e2; --accent:#4f6f53; --soft:#eef1ec;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --s-xs:11px; --s-sm:13px; --s-md:15px; --s-lg:20px; --s-xl:28px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131512; --fg:#e8eae6; --muted:#979c94; --line:#272b26; --accent:#9fbea2; --soft:#1c1f1b; color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#131512; --fg:#e8eae6; --muted:#979c94; --line:#272b26; --accent:#9fbea2; --soft:#1c1f1b; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:var(--s-md);line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
img{display:block;max-width:100%}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:56px;max-width:1440px;margin:0 auto;padding-inline:32px;padding-block:40px 64px}

/* ---------- 側欄 ---------- */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 40px);align-self:start;display:flex;flex-direction:column;gap:28px;font-size:var(--s-sm)}
.id{display:flex;flex-direction:column;gap:14px}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--soft)}
.name{font-size:var(--s-lg);font-weight:500;letter-spacing:.02em;line-height:1.35;margin:0;text-wrap:balance}
.role{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.nav a{display:inline-flex;align-items:baseline;color:var(--muted);transition:color .2s}
.nav a .p{font-family:var(--font-mono);font-size:var(--s-xs);max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:max-width .25s,opacity .2s,margin .25s}
.nav a:hover,.nav a[aria-current="page"]{color:var(--fg)}
.nav a:hover .p,.nav a[aria-current="page"] .p{max-width:10em;opacity:1;margin-right:6px;color:var(--accent)}
.nav .sep{height:1px;background:var(--line);margin:8px 0}
.social{display:flex;flex-direction:column;gap:4px;font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted)}
.social a:hover{color:var(--fg)}
.social a,.links a{display:inline-flex;align-items:center;gap:8px;width:fit-content}
.ico{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.links .ico{width:16px;height:16px}
.menu-btn{display:none}

/* ---------- 主內容 ---------- */
main{min-width:0;animation:in .35s ease both}
@keyframes in{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
.crumb{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);letter-spacing:.04em;margin:0 0 20px}
.crumb a:hover{color:var(--fg)}
.page-h{font-size:var(--s-xl);font-weight:500;margin:0 0 6px;line-height:1.3;text-wrap:balance}
.page-sub{color:var(--muted);font-size:var(--s-sm);margin:0 0 36px}

.grid{columns:3 260px;column-gap:28px}
.card{break-inside:avoid;margin:0 0 36px;display:block}
.card .img{overflow:hidden;background:var(--soft)}
.card img{width:100%;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .3s}
.card:hover img{transform:scale(1.025);opacity:.92}
.cap{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-top:10px;font-size:var(--s-sm)}
.cap .t{min-width:0}
.cap .t span{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--accent);margin-right:4px}
.cap .y{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:var(--s-sm);padding:40px 0}

/* ---------- 首頁：自動滾動作品帶 ---------- */
.ticker{overflow-x:auto;scrollbar-width:none;cursor:grab}
.ticker::-webkit-scrollbar{display:none}
.ticker.dragging{cursor:grabbing}
.ticker.dragging a{pointer-events:none}
.track{display:flex;gap:24px;width:max-content}
.tk{flex:none;display:flex;flex-direction:column;gap:10px;-webkit-user-drag:none}
.tk .img{height:clamp(240px,60vh,600px);max-width:none;overflow:hidden;background:var(--soft)}
.tk img{width:100%;height:100%;max-width:none;object-fit:cover;-webkit-user-drag:none;user-select:none;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .3s}
.tk:hover img{transform:scale(1.02);opacity:.92}
.tk .cap{margin-top:0;width:0;min-width:100%}
.hint{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);margin:14px 0 0}
.index{list-style:none;margin:56px 0 0;padding:0;border-top:1px solid var(--line)}
.index li{border-bottom:1px solid var(--line)}
.index a{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:24px;align-items:baseline;padding:12px 0;font-size:var(--s-sm);transition:color .2s}
.index a:hover{color:var(--accent)}
.index .c,.index .y{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:820px){.tk .img{height:clamp(200px,40vh,340px)}.track{gap:16px}.index a{grid-template-columns:minmax(0,1fr) auto;gap:12px}.index .c{display:none}}

/* ---------- 作品內頁 ---------- */
.work{max-width:880px}
.work-head{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:40px;margin-bottom:40px}
.work-head .en{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);letter-spacing:.06em;margin:0 0 18px}
.summary{margin:0;max-width:34em}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:var(--s-sm);margin:0;align-content:start;border-top:1px solid var(--line);padding-top:12px}
.meta dt{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);letter-spacing:.06em;padding-top:2px}
.meta dd{margin:0}
.block{display:grid;grid-template-columns:140px minmax(0,1fr);gap:24px;margin:0 0 32px}
.block h3{font-size:var(--s-sm);font-weight:500;margin:0;color:var(--muted)}
.block p{margin:0;max-width:36em}
.gallery{display:flex;flex-direction:column;gap:20px;margin:48px 0}
.gallery img{width:100%;background:var(--soft)}
.pager{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:16px;font-size:var(--s-sm)}
.pager a{display:flex;flex-direction:column;min-width:0}
.pager a:last-child{text-align:right}
.pager small{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted)}
.pager a:hover strong{color:var(--accent)}
.pager strong{font-weight:500;transition:color .2s}

/* ---------- About ---------- */
.about{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:56px;max-width:1040px}
.portrait{width:100%;aspect-ratio:1;object-fit:cover;background:var(--soft)}
.about h2{font-size:var(--s-xs);font-family:var(--font-mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.about section{display:flex;flex-direction:column}
.stack{display:flex;flex-direction:column;gap:40px}
.disc{font-size:var(--s-sm);letter-spacing:.06em;margin:0 0 16px}
.bio p{margin:0 0 12px;max-width:34em}
.mail{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.mail code{font-family:var(--font-mono);font-size:var(--s-sm);user-select:all;word-break:break-all}
.copy{font:inherit;font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;transition:.2s}
.copy:hover{color:var(--fg);border-color:var(--muted)}
.links{display:flex;flex-direction:column;gap:4px;font-family:var(--font-mono);font-size:var(--s-sm)}
.links a{color:var(--muted);word-break:break-all}.links a:hover{color:var(--fg)}
.note{font-size:var(--s-sm);color:var(--muted);margin:12px 0 0}
.exp-group{margin:0 0 20px}
.exp-group h3{font-size:var(--s-sm);font-weight:500;margin:0 0 6px}
.exp-group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:var(--s-sm)}
.exp-group li{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px}
.exp-group li span:first-child{font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.strip{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:16px}
.strip img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--soft)}

footer{grid-column:1/-1;font-family:var(--font-mono);font-size:var(--s-xs);color:var(--muted);padding-top:48px}

/* ---------- 手機 ---------- */
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:24px;padding-inline:18px;padding-block:20px 48px}
  .side{position:static;gap:16px}
  .id{flex-direction:row;align-items:center;gap:12px}
  .avatar{width:44px;height:44px}
  .name{font-size:var(--s-md)}
  .menu-btn{display:inline-flex;margin-left:auto;font:inherit;font-family:var(--font-mono);font-size:var(--s-xs);background:none;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer}
  .side-body{display:none;flex-direction:column;gap:20px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .side.open .side-body{display:flex}
  .work-head,.about{grid-template-columns:minmax(0,1fr);gap:28px}
  .block{grid-template-columns:minmax(0,1fr);gap:4px}
  .exp-group li{grid-template-columns:minmax(0,1fr);gap:0}
}
@media (min-width:821px){.side-body{display:flex;flex-direction:column;gap:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="id">
      <img class="avatar" id="avatar" alt="">
      <div>
        <p class="name" id="name"></p>
        <div class="role" id="role"></div>
      </div>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="sideBody">Menu</button>
    </div>
    <div class="side-body" id="sideBody">
      <ul class="nav" id="nav"></ul>
      <div class="social" id="social"></div>
    </div>
  </aside>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<script>
/* =========================================================
   ✏️ 修改說明（只需要改這一段 SITE 裡的文字就好）
   - 文字：直接改引號裡的字。
   - 圖片：把圖片檔放在網站資料夾的 images/ 裡，然後填路徑，
           例如 cover: "images/qingcao-cover.jpg"
           留空 "" 的地方會自動顯示灰色佔位圖。
   - 新增作品：複製 projects 裡一整個 { ... }，改 id 和內容。
   - 分類：category 要對應下面 categories 的 id。
   ========================================================= */
const SITE = {
  name: "你的名字 / Your Name",
  role: "Designer",
  avatar: "",            // 頭像，例如 "images/me.jpg"
  portrait: "",          // About 頁的大照片
  disciplines: ["包裝設計","品牌識別","插畫","版面編排","攝影"],
  bio: [
    "（用兩三句話介紹你自己：你是誰、現在在哪裡讀書或工作。）",
    "（你喜歡做什麼樣的設計？有沒有特別在意的事情，例如從使用者的痛點出發、喜歡玩材質或手作感？）",
    "（未來想往哪個方向發展。）"
  ],
  email: "your.email@example.com",
  socials: [
    { label: "Instagram", url: "https://www.instagram.com/" },
    { label: "Behance",   url: "https://www.behance.net/emilylee56" }
  ],
  contactNote: "若有合作或實習機會，歡迎與我聯繫。",
  experience: [
    { group: "學歷", items: [["2023 – 2027","（學校）（科系）"]] },
    { group: "獎項", items: [["2026/05","（獎項名稱）《作品名》"],["2025/11","（獎項名稱）《作品名》"]] },
    { group: "實習", items: [["2026/07 – 08","（公司）（職稱）"]] },
    { group: "展覽", items: [["2026/05","（展覽名稱）"],["2025/12","（市集／聯展名稱）"]] }
  ],
  categories: [
    { id: "packaging", label: "包裝設計", en: "Packaging" },
    { id: "branding",  label: "品牌識別", en: "Branding" },
    { id: "illust",    label: "插畫",     en: "Illustration" },
    { id: "editorial", label: "版面編排", en: "Editorial" },
    { id: "photo",     label: "攝影",     en: "Photography" }
  ],
  projects: [
    {
      id: "qingcao",
      title: "青草巷｜袋裝青草飲禮盒",
      en: "Qingcao Alley Herbal Tea Packaging",
      category: "packaging", year: "2026",
      cover: "", ratio: "4/5",
      summary: "為龍山寺旁的青草巷設計的創意產品包裝。鎖定一群年輕人和他們的痛點，做成一盒裝有兩款袋裝、用泡的青草飲。",
      meta: [["類型","產品包裝"],["角色","（個人／小組，負責項目）"],["工具","（Illustrator、Photoshop…）"]],
      sections: [
        { h: "背景", p: "（青草巷是什麼地方、這個題目的出發點。）" },
        { h: "受眾與痛點", p: "（你選了哪一群年輕人？他們遇到什麼問題，讓他們不會去買青草茶？）" },
        { h: "設計概念", p: "（兩款飲品分別是什麼？包裝的顏色、圖像、結構怎麼回應上面的痛點？）" },
        { h: "成品", p: "（材質、尺寸、開盒方式等細節。）" }
      ],
      images: ["","","",""]
    },
    { id: "work-2", title: "作品二（範例）", en: "Project Two", category: "branding", year: "2025", cover: "", ratio: "1/1",
      summary: "（一句話介紹這件作品。）", meta: [["類型","品牌識別"],["角色","（填寫）"]],
      sections: [{ h: "概念", p: "（作品說明。）" }], images: ["",""] },
    { id: "work-3", title: "作品三（範例）", en: "Project Three", category: "illust", year: "2025", cover: "", ratio: "3/4",
      summary: "（一句話介紹這件作品。）", meta: [["類型","插畫"]],
      sections: [{ h: "概念", p: "（作品說明。）" }], images: ["",""] },
    { id: "work-4", title: "作品四（範例）", en: "Project Four", category: "editorial", year: "2024", cover: "", ratio: "4/3",
      summary: "（一句話介紹這件作品。）", meta: [["類型","版面編排"]],
      sections: [{ h: "概念", p: "（作品說明。）" }], images: ["",""] },
    { id: "work-5", title: "作品五（範例）", en: "Project Five", category: "photo", year: "2024", cover: "", ratio: "3/4",
      summary: "（一句話介紹這件作品。）", meta: [["類型","攝影"]],
      sections: [{ h: "概念", p: "（作品說明。）" }], images: ["",""] },
    { id: "work-6", title: "作品六（範例）", en: "Project Six", category: "packaging", year: "2024", cover: "", ratio: "1/1",
      summary: "（一句話介紹這件作品。）", meta: [["類型","包裝設計"]],
      sections: [{ h: "概念", p: "（作品說明。）" }], images: ["",""] }
  ]
};
/* ===================== 以下不用改 ===================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tints = ["#d9e0d4","#e3dccf","#d6dbe0","#e2d6d6","#dcd9e3","#d8e2dd"];

function ph(label, ratio = "4/3", i = 0){
  const [w, h] = ratio.split("/").map(Number), W = 800, H = Math.round(W * h / w);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="${tints[i % tints.length]}"/><text x="50%" y="50%" fill="#6f756c" font-family="sans-serif" font-size="26" text-anchor="middle" dominant-baseline="middle">${esc(label)}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
/* 外部連結的線條 icon：依網址自動判斷網站 */
const ICONS = {
  instagram: '<rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="3.5"/><path d="M16.5 7.5v.01"/>',
  behance: '<path d="M3 18V6h4.5a3 3 0 0 1 0 6a3 3 0 0 1 0 6H3"/><path d="M3 12h4.5"/><path d="M14 13h7a3.5 3.5 0 0 0-7 0v2a3.5 3.5 0 0 0 6.64 1"/><path d="M16 6h3"/>',
  dribbble: '<circle cx="12" cy="12" r="9"/><path d="M9 3.6c5 6 7 10.5 7.5 16.2"/><path d="M6.4 19c3.5-3.5 6-6.5 14.5-6.4"/><path d="M3.1 10.75c5 0 9.814-.38 15.314-5"/>',
  linkedin: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 11v5"/><path d="M8 8v.01"/><path d="M12 16v-5"/><path d="M16 16v-3a2 2 0 0 0-4 0"/>',
  link: '<path d="M9 15l6-6"/><path d="M11 6l.46-.54a5 5 0 0 1 7.07 7.07L18 13"/><path d="M13 18l-.4.53a5.07 5.07 0 0 1-7.12 0a4.97 4.97 0 0 1 0-7.07L6 11"/>'
};
function icon(url){
  const k = Object.keys(ICONS).find(n => n !== "link" && url.includes(n)) || "link";
  return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;
}
const extLink = s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${icon(s.url)}<span>${esc(s.label)}</span></a>`;

const catOf = id => SITE.categories.find(c => c.id === id) || { label: id, en: id };
const idx = id => SITE.projects.findIndex(p => p.id === id);

function sidebar(route){
  $("#name").textContent = SITE.name;
  $("#role").textContent = SITE.role;
  const av = $("#avatar"); av.src = SITE.avatar || ph("", "1/1", 0); av.alt = SITE.name;
  const items = [["", "Home", "./"], ...SITE.categories.map(c => [c.id, c.label, "./" + c.id])];
  const link = (h, label, p) => `<li><a href="#${h || "home"}" ${route === (h || "home") ? 'aria-current="page"' : ""}><span class="p">${esc(p)}</span>${esc(label)}</a></li>`;
  $("#nav").innerHTML = items.map(i => link(...i)).join("") + `<li class="sep" aria-hidden="true"></li>` + link("about", "About", "./about");
  $("#social").innerHTML = SITE.socials.map(extLink).join("");
  $("#foot").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;
}

function grid(list){
  if (!list.length) return `<p class="empty">這個分類還沒有作品。</p>`;
  return `<div class="grid">${list.map(p => {
    const i = idx(p.id);
    return `<a class="card" href="#w-${p.id}"><div class="img"><img src="${p.cover || ph(p.title, p.ratio, i)}" alt="${esc(p.title)}" loading="lazy"></div>
      <div class="cap"><div class="t"><span>./</span>${esc(p.title)}</div><div class="y">${esc(catOf(p.category).en)} · ${esc(p.year)}</div></div></a>`;
  }).join("")}</div>`;
}

function home(){
  const item = (p, dup) => {
    const i = idx(p.id);
    return `<a class="tk" href="#w-${p.id}" draggable="false" ${dup ? 'aria-hidden="true" tabindex="-1"' : ""}>
      <div class="img" style="aspect-ratio:${esc(p.ratio || "4/5")}"><img src="${p.cover || ph(p.title, p.ratio, i)}" alt="${dup ? "" : esc(p.title)}" draggable="false"></div>
      <div class="cap"><div class="t"><span>./</span>${esc(p.title)}</div><div class="y">${esc(p.year)}</div></div></a>`;
  };
  const list = SITE.projects;
  return `<p class="crumb">./works</p><h1 class="page-h">Selected Works</h1><p class="page-sub">${SITE.disciplines.map(esc).join("｜")}</p>
    <div class="ticker" id="ticker"><div class="track">${list.map(p => item(p, false)).join("")}${list.map(p => item(p, true)).join("")}</div></div>
    <p class="hint">滑鼠移上去暫停 · 可拖曳或左右滑動</p>
    <ul class="index">${list.map(p => `<li><a href="#w-${p.id}"><span>${esc(p.title)}</span><span class="c">${esc(catOf(p.category).label)}</span><span class="y">${esc(p.year)}</span></a></li>`).join("")}</ul>`;
}

/* 作品帶自動滾動：無限循環、滑鼠移上暫停、可拖曳 */
let stopTicker = () => {};
function startTicker(){
  stopTicker();
  const el = $("#ticker"); if (!el) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SPEED = reduce ? 0 : 40;              // 每秒移動幾 px，想快一點就改大
  let pos = 0, last = performance.now(), paused = false, resumeT, raf, drag = null;
  const half = () => el.querySelector(".track").scrollWidth / 2;
  const wrap = () => { const h = half(); if (h > 0) { if (pos >= h) pos -= h; if (pos < 0) pos += h; } };
  const tick = now => {
    const dt = Math.min(now - last, 64) / 1000; last = now;
    if (!paused && !drag) { pos += SPEED * dt; wrap(); el.scrollLeft = pos; }
    raf = requestAnimationFrame(tick);
  };
  el.addEventListener("scroll", () => { if (Math.abs(el.scrollLeft - pos) > 2) { pos = el.scrollLeft; wrap(); if (pos !== el.scrollLeft) el.scrollLeft = pos; } });
  el.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") paused = true; });
  el.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") paused = false; });
  el.addEventListener("focusin", () => paused = true);
  el.addEventListener("focusout", () => paused = false);
  el.addEventListener("touchstart", () => { paused = true; clearTimeout(resumeT); }, { passive: true });
  el.addEventListener("touchend", () => { resumeT = setTimeout(() => paused = false, 2000); });
  el.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse" || e.button !== 0) return; drag = { x: e.clientX, start: pos, moved: false }; });
  addEventListener("pointermove", onMove);
  addEventListener("pointerup", onUp);
  function onMove(e){ if (!drag) return; const dx = e.clientX - drag.x; if (Math.abs(dx) > 5 && !drag.moved) { drag.moved = true; el.classList.add("dragging"); } if (drag.moved) { pos = drag.start - dx; wrap(); el.scrollLeft = pos; } }
  function onUp(){ if (!drag) return; const moved = drag.moved; drag = null; setTimeout(() => el.classList.remove("dragging"), 0); if (moved) el.addEventListener("click", ev => ev.preventDefault(), { capture: true, once: true }); }
  raf = requestAnimationFrame(tick);
  stopTicker = () => { cancelAnimationFrame(raf); clearTimeout(resumeT); removeEventListener("pointermove", onMove); removeEventListener("pointerup", onUp); stopTicker = () => {}; };
}
function category(c){
  return `<p class="crumb"><a href="#home">./</a>${esc(c.id)}</p><h1 class="page-h">${esc(c.label)}</h1><p class="page-sub">${esc(c.en)}</p>${grid(SITE.projects.filter(p => p.category === c.id))}`;
}
function work(p){
  const i = idx(p.id), n = SITE.projects.length, prev = SITE.projects[(i - 1 + n) % n], next = SITE.projects[(i + 1) % n], c = catOf(p.category);
  return `<article class="work">
    <p class="crumb"><a href="#home">./</a><a href="#${c.id}">${esc(c.id)}</a>/${esc(p.id)}</p>
    <div class="work-head"><div><h1 class="page-h">${esc(p.title)}</h1><p class="en">${esc(p.en)} — ${esc(p.year)}</p><p class="summary">${esc(p.summary)}</p></div>
      <dl class="meta">${[["年份", p.year], ...(p.meta || [])].map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>
    <div class="gallery"><img src="${p.cover || ph(p.title, p.ratio, i)}" alt="${esc(p.title)}"></div>
    ${(p.sections || []).map(s => `<div class="block"><h3>${esc(s.h)}</h3><p>${esc(s.p)}</p></div>`).join("")}
    <div class="gallery">${(p.images || []).map((src, k) => `<img src="${src || ph("作品圖 " + (k + 1), "16/10", i + k + 1)}" alt="${esc(p.title)} 圖 ${k + 1}" loading="lazy">`).join("")}</div>
    <nav class="pager"><a href="#w-${prev.id}"><small>← Prev</small><strong>${esc(prev.title)}</strong></a><a href="#w-${next.id}"><small>Next →</small><strong>${esc(next.title)}</strong></a></nav>
  </article>`;
}
function about(){
  return `<p class="crumb"><a href="#home">./</a>about</p>
  <div class="about">
    <img class="portrait" src="${SITE.portrait || ph("你的照片", "1/1", 1)}" alt="${esc(SITE.name)}">
    <div class="stack">
      <section><h1 class="page-h">${esc(SITE.name)}</h1><div class="role">${esc(SITE.role)}</div></section>
      <section class="bio"><h2>About</h2><p class="disc">${SITE.disciplines.map(esc).join(" ｜ ")}</p>${SITE.bio.map(b => `<p>${esc(b)}</p>`).join("")}</section>
      <section><h2>Email</h2><div class="mail"><code id="mail">${esc(SITE.email)}</code><button class="copy" id="copyBtn" type="button">複製</button></div></section>
      <section><h2>Follow</h2><div class="links">${SITE.socials.map(s => extLink({ label: s.url.replace(/^https?:\/\/(www\.)?/, ""), url: s.url })).join("")}</div><p class="note">${esc(SITE.contactNote)}</p></section>
      <section><h2>Experience</h2>${SITE.experience.map(g => `<div class="exp-group"><h3>［${esc(g.group)}。］</h3><ul>${g.items.map(([d, t]) => `<li><span>${esc(d)}</span><span>${esc(t)}</span></li>`).join("")}</ul></div>`).join("")}</section>
    </div>
    <div class="strip">${SITE.projects.slice(0, 5).map((p, i) => `<a href="#w-${p.id}"><img src="${p.cover || ph(p.title, "3/4", i)}" alt="${esc(p.title)}" loading="lazy"></a>`).join("")}</div>
  </div>`;
}

function render(){
  const route = (location.hash || "#home").slice(1) || "home";
  let html, active = route;
  if (route === "about") html = about();
  else if (route.startsWith("w-") && idx(route.slice(2)) > -1) { const p = SITE.projects[idx(route.slice(2))]; html = work(p); active = p.category; }
  else if (SITE.categories.some(c => c.id === route)) html = category(catOf(route));
  else { html = home(); active = "home"; }
  sidebar(active);
  const m = $("#main"); m.style.animation = "none"; m.offsetHeight; m.style.animation = "";
  m.innerHTML = html;
  $("#side").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false");
  window.scrollTo(0, 0);
  if ($("#ticker")) startTicker(); else stopTicker();
  const btn = $("#copyBtn");
  if (btn) btn.onclick = () => {
    const done = t => { btn.textContent = t; setTimeout(() => btn.textContent = "複製", 1600); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents($("#mail")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done("已選取"); };
    try { navigator.clipboard.writeText(SITE.email).then(() => done("已複製"), sel); } catch (e) { sel(); }
  };
}
$("#menuBtn").onclick = () => { const o = $("#side").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", o); };
addEventListener("hashchange", render);
render();
</script>
